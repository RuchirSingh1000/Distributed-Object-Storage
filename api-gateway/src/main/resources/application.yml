server:
  port: 8080

spring:
  application:
    name: api-gateway

# For local testing, we disable Eureka client since we're running services directly
# In production with Eureka server, these would be set appropriately
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true

# Service URLs for the gateway to forward requests to
gateway:
  metadata-service-url: http://localhost:8081
  storage-service-url: http://localhost:8082

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true