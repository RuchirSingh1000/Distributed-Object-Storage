server:
  port: 8081

spring:
  application:
    name: metadata-service
  datasource:
    url: jdbc:postgresql://postgres:5432/distributed_storage
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  redis:
    host: redis
    port: 6379
    timeout: 5000ms

# Kafka configuration
kafka:
  bootstrap-servers: kafka:9092
  topic:
    file-events: file-events
    replication-events: replication-events

# Eureka client (for service discovery)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true